name = "drum-sheet-bug-report"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Secrets (wrangler secret put): RESEND_API_KEY, REPORT_TO.
# The sender uses the domain verified in Resend (mail.teamit.ericshim.me).
[vars]
REPORT_FROM = "Drum Sheet Capture <reports@mail.teamit.ericshim.me>"

# Five reports per minute per IP address.
[[ratelimits]]
name = "REPORT_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
