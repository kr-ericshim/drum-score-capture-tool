<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>디자인 방향 비교</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Mono:wght@400;700&family=Noto+Serif+KR:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#ececea;font-family:Pretendard,-apple-system,sans-serif;color:#1b1b1b}
.top{max-width:1240px;margin:0 auto;padding:28px 20px 8px}
.top h1{font-size:22px;margin:0 0 6px}
.top p{margin:0;color:#555;font-size:14px;line-height:1.6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.tabs button{font:inherit;font-size:14px;padding:10px 14px;border-radius:10px;border:1px solid #d4d4d0;background:#fff;cursor:pointer;text-align:left}
.tabs button b{display:block;font-size:15px}
.tabs button span{font-size:12px;color:#666}
.tabs button[aria-selected=true]{background:#1b1b1b;color:#fff;border-color:#1b1b1b}
.tabs button[aria-selected=true] span{color:#bbb}
.note{max-width:1240px;margin:14px auto 0;padding:0 20px;display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:16px;font-size:13.5px;line-height:1.6}
.note div{background:#fff;border-radius:10px;padding:14px 16px}
.note h3{margin:0 0 4px;font-size:13px;color:#777;font-weight:600}
.stagewrap{max-width:1240px;margin:16px auto 40px;padding:0 20px}
.frame{width:1200px;height:760px;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.15);transform-origin:top left}
@media (max-width:1240px){.note{grid-template-columns:1fr}}

/* ===== shared app skeleton ===== */
.app{width:100%;height:100%;display:grid;grid-template-rows:auto 1fr;background:var(--bg);color:var(--ink);font-family:var(--font)}
.bar{display:flex;align-items:center;gap:18px;padding:0 16px;height:48px;border-bottom:1px solid var(--line);background:var(--bar)}
.brand{font-weight:700;font-size:13px;display:flex;align-items:center;gap:8px}
.steps{display:flex;gap:2px;font-size:13px}
.steps span{padding:6px 10px;border-radius:var(--r);color:var(--muted)}
.steps span.on{color:var(--ink);background:var(--chip);font-weight:600}
.steps span.done::before{content:"✓ ";color:var(--acc)}
.file{margin-left:auto;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.cta{font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--r);border:0;background:var(--cta);color:var(--ctaInk)}
.body{display:grid;grid-template-columns:360px 1fr;min-height:0}
.rail{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--rail)}
.railhead{display:flex;align-items:center;gap:8px;padding:12px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.railhead .seg{display:flex;background:var(--chip);border-radius:var(--r);padding:2px}
.railhead .seg i{font-style:normal;padding:4px 9px;border-radius:calc(var(--r) - 2px)}
.railhead .seg i.on{background:var(--bar);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.railhead .cnt{margin-left:auto;font-variant-numeric:tabular-nums}
.list{overflow:auto;flex:1}
.row{display:grid;grid-template-columns:18px 22px 1fr;gap:8px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line2);font-size:12px}
.row .ck{width:15px;height:15px;border-radius:4px;border:1.5px solid var(--muted);display:grid;place-items:center;font-size:10px;color:#fff}
.row .ck.on{background:var(--ink);border-color:var(--ink)}
.row .n{color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--mono)}
.row .s{position:relative}
.row img{width:100%;display:block;background:#fff;border-radius:3px;border:1px solid var(--line2)}
.row .meta{display:flex;justify-content:space-between;margin-top:4px;color:var(--muted);font-family:var(--mono);font-size:11px}
.row.focus{background:var(--sel)}
.row.off img{opacity:.35}
.row.off .n{text-decoration:line-through}
.flag{color:var(--warn);font-weight:600;font-family:var(--font)}
.main{position:relative;display:grid;grid-template-rows:1fr auto;min-height:0;background:var(--canvas)}
.pagearea{display:grid;place-items:center;overflow:hidden;padding:22px}
.page{width:420px;aspect-ratio:1/1.414;background:#fff;box-shadow:var(--pageShadow);padding:30px 26px;display:flex;flex-direction:column;gap:10px}
.page h4{margin:0 0 6px;text-align:center;font-size:14px;color:#111;font-family:var(--pageFont)}
.page small{text-align:center;display:block;margin:-8px 0 8px;font-size:9px;color:#666}
.page img{width:100%;display:block}
.page .hl{outline:2px solid var(--acc);outline-offset:3px;border-radius:2px}
.tools{display:flex;align-items:center;gap:6px;padding:10px 16px;border-top:1px solid var(--line);background:var(--bar);font-size:12.5px}
.tools .g{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tools .g i{font-style:normal;padding:6px 10px;border-right:1px solid var(--line);color:var(--ink)}
.tools .g i:last-child{border-right:0}
.tools .sp{flex:1}
.tools kbd{font-family:var(--mono);font-size:11px;padding:2px 5px;border:1px solid var(--line);border-radius:4px;color:var(--muted);background:var(--bar)}
.hint{color:var(--muted);display:flex;gap:10px;align-items:center}
.pgtag{position:absolute;top:14px;left:16px;font-size:12px;color:var(--muted);font-family:var(--mono)}

/* ===== A: Linear / Raycast ===== */
.A{--bg:#fbfbfc;--bar:#fff;--rail:#fbfbfc;--canvas:#f4f4f6;--ink:#1c1d21;--muted:#6b6f76;--line:#e6e6ea;--line2:#efeff2;--chip:#efeff3;--sel:#eeeefc;--acc:#5e6ad2;--warn:#c2410c;--cta:#5e6ad2;--ctaInk:#fff;--r:6px;--font:Pretendard,Inter,sans-serif;--mono:'JetBrains Mono',monospace;--pageFont:Pretendard;--pageShadow:0 0 0 1px #e3e3e8,0 8px 24px rgba(20,20,40,.08)}
.A .brand::before{content:"";width:16px;height:16px;border-radius:4px;background:#1c1d21}
.A .row.focus{box-shadow:inset 2px 0 0 var(--acc)}

/* ===== B: Things / Bear — paper + red pencil ===== */
.B{--bg:#f7f4ee;--bar:#fbf9f5;--rail:#f7f4ee;--canvas:#ece8df;--ink:#24211d;--muted:#7a7268;--line:#e2dcd0;--line2:#ebe6dc;--chip:#ece6da;--sel:#fff;--acc:#e0482e;--warn:#e0482e;--cta:#24211d;--ctaInk:#fbf9f5;--r:8px;--font:Pretendard,sans-serif;--mono:Pretendard,sans-serif;--pageFont:'Noto Serif KR',serif;--pageShadow:0 1px 0 #d9d2c4,0 18px 40px rgba(60,40,10,.12)}
.B .brand{font-family:'Noto Serif KR',serif;font-size:15px}
.B .row.focus{box-shadow:inset 0 0 0 1.5px var(--acc);border-radius:8px;margin:2px 6px;border-bottom-color:transparent}
.B .row .ck.on{background:var(--acc);border-color:var(--acc)}
.B .row.off img{opacity:.3;filter:sepia(.4)}
.B .steps span.on{background:transparent;box-shadow:inset 0 -2px 0 var(--acc);border-radius:0}

/* ===== C: Teenage Engineering / Nothing — instrument panel ===== */
.C{--bg:#e9e9e6;--bar:#e9e9e6;--rail:#e9e9e6;--canvas:#dcdcd8;--ink:#0d0d0d;--muted:#5d5d58;--line:#0d0d0d;--line2:#c4c4bf;--chip:#0d0d0d;--sel:#ff5a1f;--acc:#ff5a1f;--warn:#ff5a1f;--cta:#ff5a1f;--ctaInk:#0d0d0d;--r:0px;--font:'Space Mono',monospace;--mono:'Space Mono',monospace;--pageFont:'Space Mono',monospace;--pageShadow:4px 4px 0 #0d0d0d}
.C .app{font-size:12px;text-transform:none}
.C .brand{font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.C .brand::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc)}
.C .steps span{text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.C .steps span.on{color:#e9e9e6;background:#0d0d0d}
.C .cta{text-transform:uppercase;letter-spacing:.06em;font-size:11px;border:1.5px solid #0d0d0d}
.C .railhead .seg i.on{background:#e9e9e6;box-shadow:none}
.C .railhead .seg{color:#e9e9e6}
.C .row.focus{background:var(--acc)}
.C .row.focus .n,.C .row.focus .meta{color:#0d0d0d}
.C .row .ck{border-radius:0;border-color:#0d0d0d}
.C .row img{border-radius:0;border-color:#0d0d0d;filter:grayscale(1) contrast(1.1)}
.C .page{border:1.5px solid #0d0d0d}
.C .tools .g i{text-transform:uppercase;font-size:11px}
.C .pagearea{background-image:linear-gradient(#c9c9c4 1px,transparent 1px),linear-gradient(90deg,#c9c9c4 1px,transparent 1px);background-size:24px 24px}

/* ===== D: Figma / Framer — canvas + floating panels ===== */
.D{--bg:#f5f5f5;--bar:#fff;--rail:#fff;--canvas:#efefef;--ink:#1e1e1e;--muted:#737373;--line:#e6e6e6;--line2:#f0f0f0;--chip:#f0f0f0;--sel:#e5f0ff;--acc:#0d99ff;--warn:#f24822;--cta:#0d99ff;--ctaInk:#fff;--r:8px;--font:Pretendard,sans-serif;--mono:'JetBrains Mono',monospace;--pageFont:Pretendard;--pageShadow:0 2px 12px rgba(0,0,0,.08)}
.D .body{grid-template-columns:1fr}
.D .rail{position:absolute;left:12px;top:60px;bottom:12px;width:330px;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.08);z-index:2;overflow:hidden}
.D .main{background-color:var(--canvas);background-image:radial-gradient(#d6d6d6 1px,transparent 1px);background-size:18px 18px}
.D .app{position:relative}
.D .pagearea{padding-left:360px}
.D .tools{position:absolute;bottom:16px;left:calc(50% + 170px);transform:translateX(-50%);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);width:auto}
.D .tools .hint{display:none}
.D .tools .sp{display:none}
.D .pgtag{left:360px}
</style></head><body>
<div class="top">
<h1>드럼 악보 캡처 — 디자인 방향 4가지</h1>
<p>같은 "검토 · 저장" 화면을 레퍼런스 4개 스타일로 그려봤어요. 구조(왼쪽 악보 줄 목록 + 오른쪽 실제 PDF 페이지)는 공통이고, <b>느낌만</b> 다릅니다. 탭을 눌러 비교해보고 마음에 드는 것 하나, 또는 "A의 이거 + C의 저거"처럼 골라주세요.</p>

function mock(k){
 const rows=Array.from({length:14},(_,i)=>{const off=i==9,fl=i==4,f=i==2;
  return `<div class="row ${f?'focus':''} ${off?'off':''}"><span class="ck ${off?'':'on'}">${off?'':'✓'}</span><span class="n">${String(i+1).padStart(2,'0')}</span><div class="s"><img src="${IMG}"><div class="meta"><span>${fl?'<span class="flag">● 확인 필요</span>':off?'제외됨':''}</span><span>0${Math.floor((12+i*9)/60)}:${String((12+i*9)%60).padStart(2,'0')}</span></div></div></div>`}).join('');
 const strips=[0,1,2,3,4,5].map(i=>`<img src="${IMG}" class="${i==2?'hl':''}">`).join('');
 return `<div class="app ${k}"><div class="bar"><span class="brand">Drum Sheet Capture</span>
 <div class="steps"><span class="done">영상</span><span class="done">영역</span><span class="done">만들기</span><span class="on">검토 · 저장</span></div>
 <span class="file">Rosanna - Toto (Drum Cover).mp4</span><button class="cta">PDF 저장</button></div>
 <div class="body"><aside class="rail"><div class="railhead"><div class="seg"><i class="on">전체 14</i><i>확인 필요 2</i></div><span class="cnt">13 / 14 포함</span></div><div class="list">${rows}</div></aside>
 <section class="main"><span class="pgtag">PDF 1 / 3 페이지</span><div class="pagearea"><div class="page"><h4>Rosanna — Toto</h4><small>Drum Cover · 2026.09.27</small>${strips}</div></div>
 <div class="tools"><div class="g"><i>−</i><i>100%</i><i>+</i><i>맞춤</i></div><div class="g"><i>자르기</i><i>되돌리기</i></div><span class="sp"></span><span class="hint"><kbd>↑↓</kbd>이동 <kbd>Space</kbd>포함/제외</span></div></section></div></div>`;
}
const tabs=document.querySelector('.tabs'),frame=document.getElementById('frame'),note=document.getElementById('note');
function show(k){[...tabs.children].forEach(b=>b.setAttribute('aria-selected',b.dataset.k==k));frame.innerHTML=mock(k);
 const d=D[k];note.innerHTML=`<div><h3>레퍼런스</h3>${d.ref}</div><div><h3>좋은 점</h3>${d.good}</div><div><h3>주의할 점</h3>${d.bad}</div>`;fit();try{localStorage.setItem('dir',k)}catch(e){}}
Object.entries(D).forEach(([k,d])=>{const b=document.createElement('button');b.dataset.k=k;b.role='tab';b.innerHTML=`<b>${d.t}</b><span>${d.s}</span>`;b.onclick=()=>show(k);tabs.appendChild(b)});
function fit(){const w=Math.min(1200,document.querySelector('.stagewrap').clientWidth-40);const s=w/1200;frame.style.transform=`scale(${s})`;frame.parentElement.style.height=(760*s+10)+'px'}
addEventListener('resize',fit);
let k0='A';try{k0=localStorage.getItem('dir')||'A'}catch(e){}
show(new URLSearchParams(location.search).get('d')||k0);
</script></body></html>
