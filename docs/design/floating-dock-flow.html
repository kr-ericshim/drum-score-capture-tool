<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>플로팅 도크 전체 흐름</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e9e9;font-family:Pretendard,-apple-system,sans-serif;color:#1e1e1e}
.top{max-width:1240px;margin:0 auto;padding:28px 20px 8px}
.top h1{font-size:22px;margin:0 0 6px}.top p{margin:0;color:#555;font-size:14px;line-height:1.6}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 0}
.tabs button{font:inherit;font-size:14px;padding:10px 14px;border-radius:10px;border:1px solid #d4d4d4;background:#fff;cursor:pointer}
.tabs button[aria-selected=true]{background:#1e1e1e;color:#fff;border-color:#1e1e1e}
.note{max-width:1240px;margin:14px auto 0;padding:0 20px}
.note div{background:#fff;border-radius:10px;padding:14px 16px;font-size:13.5px;line-height:1.7}
.note ul{margin:4px 0 0;padding-left:18px}
.stagewrap{max-width:1240px;margin:16px auto 40px;padding:0 20px}
.frame{width:1200px;height:760px;border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.15);transform-origin:top left;position:relative}

.app{--ink:#1e1e1e;--muted:#737373;--line:#e6e6e6;--line2:#f0f0f0;--acc:#0d99ff;--sel:#e5f0ff;--warn:#f24822;--ok:#14ae5c;--mono:'JetBrains Mono',monospace;
 position:absolute;inset:0;background-color:#efefef;background-image:radial-gradient(#d4d4d4 1px,transparent 1px);background-size:18px 18px;font-size:12.5px;color:var(--ink)}
.float{position:absolute;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.09)}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:8px 14px;background:var(--acc);color:#fff;white-space:nowrap}
.btn.dis{background:#e8e8e8;color:#a3a3a3}
.ghost{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;color:var(--ink);white-space:nowrap}
.full{width:100%}
.t{font-family:var(--mono);color:var(--muted);font-size:10.5px}
.n{font-family:var(--mono);color:var(--muted);font-size:11px}
.flag{color:var(--warn);font-weight:600}
kbd{font-family:var(--mono);font-size:10.5px;padding:1px 5px;border:1px solid var(--line);border-radius:4px;color:var(--muted);background:#fff}
.seg{display:flex;background:#f2f2f2;border-radius:8px;padding:2px;font-size:12px}.seg i{font-style:normal;padding:4px 9px;border-radius:6px;color:var(--muted);flex:1;text-align:center;white-space:nowrap}.seg i.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.ck{width:15px;height:15px;border-radius:4px;border:1.5px solid #999;display:grid;place-items:center;font-size:10px;color:#fff;flex:none}.ck.on{background:var(--ink);border-color:var(--ink)}
.logo{width:28px;height:28px;border-radius:8px;background:#1e1e1e;color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
/* dock */
.dock{left:12px;top:12px;bottom:12px;width:58px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.dock .st{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;align-content:center;font-size:10px;color:var(--muted);text-align:center;line-height:1.2}
.dock .st b{display:block;font-size:13px;color:#b5b5b5}
.dock .st.ok b{color:var(--acc)}.dock .st.ok{color:var(--ink)}
.dock .st.on{background:var(--sel);color:var(--acc)}.dock .st.on b{color:var(--acc)}
.dock .st.lock{opacity:.5}
.dock .gap{flex:1}.dock .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);margin-bottom:4px}
/* panel */
.panel{left:82px;top:12px;bottom:12px;width:300px;display:flex;flex-direction:column;overflow:hidden}
.ph{padding:14px 16px 12px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:15px}.ph .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.sec{padding:14px 16px;border-bottom:1px solid var(--line2)}
.sec h3{margin:0 0 8px;font-size:11.5px;color:var(--muted);font-weight:600}
.pf{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.input{border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:#a3a3a3;background:#fafafa}
.opt{display:flex;align-items:center;gap:8px;padding:7px 0}
.kv{display:flex;justify-content:space-between;padding:6px 0;color:var(--muted)}.kv b{color:var(--ink);font-weight:500}
/* canvas items */
.act{right:12px;top:12px;display:flex;gap:6px;align-items:center;padding:6px}
.tools{display:flex;align-items:center;gap:4px;padding:6px;left:calc(50% + 197px);transform:translateX(-50%);bottom:14px}
.tools i{white-space:nowrap;font-style:normal;padding:6px 10px;border-radius:7px}.tools .sep{width:1px;height:18px;background:var(--line);margin:0 4px;padding:0}
.tools i.on{background:var(--sel);color:var(--acc)}
.lbl{position:absolute;font-family:var(--mono);font-size:11px;color:var(--muted)}
.page{position:absolute;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.08);padding:26px 22px;display:flex;flex-direction:column;gap:9px;aspect-ratio:1/1.414}
.page h4{margin:0 0 4px;text-align:center;font-size:13px;font-family:Georgia,serif}.page small{text-align:center;display:block;margin:-6px 0 6px;font-size:8.5px;color:#666}
.page img{width:100%;display:block}.page .hl{outline:2px solid var(--acc);outline-offset:3px;border-radius:2px}
/* source */
.drop{position:absolute;left:470px;top:150px;width:620px;height:250px;border:2px dashed #bdbdbd;border-radius:16px;display:grid;place-items:center;text-align:center;background:rgba(255,255,255,.55)}
.drop b{font-size:17px;display:block;margin:10px 0 4px}.drop .ic{font-size:30px;color:#999}
.recent{left:470px;top:430px;width:620px;padding:6px 0}
.recent .rh{display:flex;justify-content:space-between;padding:8px 16px;color:var(--muted);font-size:11.5px}
.recent .r{display:grid;grid-template-columns:72px 1fr auto auto;gap:14px;align-items:center;padding:8px 16px;border-top:1px solid var(--line2)}
.recent .th{width:72px;height:40px;border-radius:5px;background:#2a2c31 center/cover}
/* roi */
.vid{position:absolute;left:420px;top:90px;width:720px;aspect-ratio:16/9;background:#000 center/cover;box-shadow:0 2px 14px rgba(0,0,0,.15)}
.roi{position:absolute;left:0;right:0;top:67%;height:25.5%;border:2px solid var(--acc);background:rgba(13,153,255,.08)}
.roi i{position:absolute;width:10px;height:10px;background:#fff;border:2px solid var(--acc);border-radius:2px}
.roi .tag{position:absolute;top:-26px;left:-2px;background:var(--acc);color:#fff;font-size:11px;padding:3px 8px;border-radius:6px 6px 6px 0;white-space:nowrap;font-weight:600}
.scrub{left:420px;width:720px;top:530px;padding:10px 14px}
.scrub .bar{position:relative;height:30px;margin-top:6px;border-radius:6px;background:linear-gradient(90deg,#e9eef5,#e9eef5)}
.scrub .bar .m{position:absolute;top:0;bottom:0;width:2px;background:#9ec9ee}
.scrub .bar .ph2{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--acc);border-radius:2px}
.scrub .row{display:flex;justify-content:space-between;align-items:center}
.cand{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cand div{border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.cand div.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--sel)}
.cand .im{aspect-ratio:16/9;background:#000 center/cover}
.cand .c{display:flex;justify-content:space-between;padding:4px 6px;font-size:11px}
.status{display:flex;gap:8px;align-items:flex-start;padding:10px;border-radius:8px;background:#f5f9ff;border:1px solid #d6e9fb;line-height:1.5;font-size:12px}
.status .d{width:8px;height:8px;border-radius:50%;background:var(--acc);margin-top:5px;flex:none}
/* export */
.prog{left:50%;transform:translateX(calc(-50% + 197px));top:12px;padding:10px 14px;width:360px}
.prog .pb{height:6px;border-radius:3px;background:#eee;margin-top:8px;overflow:hidden}.prog .pb i{display:block;height:100%;width:42%;background:var(--acc)}
/* review list */
.rows{overflow:hidden;flex:1}
.rw{display:grid;grid-template-columns:16px 20px 1fr;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line2)}
.rw img{width:100%;display:block;border:1px solid var(--line2);border-radius:3px}
.rw .m{display:flex;justify-content:space-between;margin-top:3px}
.rw.f{background:var(--sel)}.rw.off img{opacity:.3}
</style></head><body>
<div class="top">
<h1>1번 "떠 있는 도크" — 네 단계 전체 흐름</h1>
<p>모든 화면에서 틀은 같아요. <b>왼쪽 도크 = 단계 이동</b>, <b>옆 패널 = 이 단계에서 할 일</b>, <b>캔버스 = 작업 대상</b>, <b>오른쪽 위 = 다음 행동 버튼 하나</b>, <b>아래 = 캔버스 도구</b>.</p>
