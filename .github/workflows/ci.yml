name: CI

on:
  push:
    # Work branches only. main receives fast-forwards of commits already tested on
    # their branch, and a version tag reuses this run's result for the same commit
    # (the Release workflow runs the backend suite itself when no such run exists).
    branches-ignore:
      - main
    # A docs-only commit needs no test run.
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # A newer push to the same branch or PR supersedes the running one.
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-15
          - windows-latest

    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          cache: "pip"
          cache-dependency-path: backend/requirements-build.lock

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Check release versions
        run: node desktop/scripts/check-release-version.js

      - name: Check media recipe matches its lock
        shell: bash
        run: |
          set -euo pipefail
          recipe="$(python scripts/media_bundle.py recipe)"
          locked="$(python -c "import json; print(json.load(open('backend/media-tools.lock.json'))['recipe'])")"
          if [ "$recipe" != "$locked" ]; then
            echo "::error file=backend/media-tools.lock.json::Media recipe $recipe does not match the lock ($locked). Release restore would fail. Revert the recipe change (this includes any edit to .github/workflows/media-tools.yml), or rebuild with the Media tools workflow and commit its lock. See docs/release/media-toolchain.md."
            exit 1
          fi

      # The backend suite runs real ffmpeg (original screens); use the same pinned tools as the release.
      - name: Restore and verify pinned media tools
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python scripts/media_bundle.py restore; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Media bundle restore failed (attempt $attempt of 3); retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Verify release docs exist
        shell: bash
        run: |
          test -f LICENSE
          test -f README.md
          test -f README.en.md
          test -f README.ko.md
          test -f docs/release/github-release-runbook.md
          test -f docs/release/final-production-checklist.md

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-build.lock -r backend/requirements-test.txt

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      # The quick checks run first so their failures show in minutes, not after the backend suite.
      - name: Verify renderer-v2
        working-directory: desktop
        run: npm run verify:renderer-v2

      - name: Run desktop node tests
        working-directory: desktop
        run: npm run test:desktop-node

      - name: Test media bundle validation
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'

      # Real-time scanning of the many temp files the suite writes slows the Windows runner.
      - name: Turn off Defender real-time scanning
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      # Same unittest suite, spread over the runner's cores; serially it outgrows the timeout.
      # loadfile keeps each module on one worker: worksteal repeated heavy class fixtures and
      # measured slower (Windows 1242 s vs 1029 s).
      - name: Run backend tests
        shell: bash
        run: PYTHONPATH=backend python -m pytest backend/tests -n auto --dist loadfile -p no:cacheprovider -q --durations 15
