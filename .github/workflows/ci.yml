name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Run backend tests
        shell: bash
        run: PYTHONPATH=backend python -m unittest discover -s backend/tests -p 'test_*.py'

      - name: Verify renderer-v2
        working-directory: desktop
        run: npm run verify:renderer-v2

      - name: Run desktop node tests
        working-directory: desktop
        run: npm run test:desktop-node

      - name: Verify release docs exist
        shell: bash
        run: |
          test -f LICENSE
          test -f README.md
          test -f README.en.md
          test -f README.ko.md
          test -f docs/reports/2026-03-09-github-production-readiness-report.md
          test -f docs/release/github-release-runbook.md
          test -f docs/release/final-production-checklist.md
          test -f docs/release/release-notes-v0.1.30.md
