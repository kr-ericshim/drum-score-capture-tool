name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "codex/release-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The event is part of the group so a manual dispatch on a tag cannot displace a queued
  # tag-push run, which is the only one that publishes.
  group: release-${{ github.event_name }}-${{ github.ref }}
  # Never cancel a tag build: publish must see both platforms. Preflight branches may be superseded.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: dist/*.exe
          - os: macos-15
            artifact_glob: dist/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    env:
      # Disable certificate signing; macOS still receives an explicit ad-hoc signature.
      DRUMSHEET_ENABLE_SIGNING: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"
          # No pip cache here: the lock has no hashes, so a restored cache could not be verified
          # before it reaches the published installers. (npm ci checks every tarball's integrity.)

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Check release versions
        run: node desktop/scripts/check-release-version.js

      # Runs before the test suite so a stale recipe or a missing bundle fails within seconds.
      # media_bundle.py is part of the pinned recipe, so transient download retries live here.
      - name: Restore and verify pinned media tools
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if python scripts/media_bundle.py restore; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Media bundle restore failed (attempt $attempt of 3); retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Install backend build dependencies
        run: python -m pip install -r backend/requirements-build.lock

      - name: Run backend test suite
        shell: bash
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p 'test_*.py'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Verify renderer-v2
        working-directory: desktop
        shell: bash
        run: npm run verify:renderer-v2

      - name: Run desktop node tests
        working-directory: desktop
        shell: bash
        run: npm run test:desktop-node

      - name: Build release artifacts and verify macOS app and DMG signatures
        working-directory: desktop
        run: npm run dist:release

      - name: Smoke test packaged Electron app
        working-directory: desktop
        run: npm run smoke:packaged-electron

      - name: Smoke test packaged backend runtime
        working-directory: desktop
        run: npm run smoke:packaged-runtime

      - name: Save package size report
        uses: actions/upload-artifact@v7
        with:
          name: package-size-${{ matrix.os }}
          path: dist/package-size-*.json
          if-no-files-found: error

      - name: Verify release upload assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=( ${{ matrix.artifact_glob }} )
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release upload assets matched: ${{ matrix.artifact_glob }}" >&2
            exit 1
          fi
          version="$(node -p "require('./desktop/package.json').version")"
          for artifact in "${artifacts[@]}"; do
            if [ ! -s "$artifact" ]; then
              echo "Release upload asset is missing or empty: $artifact" >&2
              exit 1
            fi
            case "$artifact" in
              *"$version"*) ;;
              *)
                echo "Release upload asset does not include version $version: $artifact" >&2
                exit 1
                ;;
            esac
            ls -lh "$artifact"
          done

      - name: Save verified installers
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          path: |
            ${{ matrix.artifact_glob }}
            dist/ffmpeg-*-source.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download both verified platform installers
        uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Confirm both platforms and release notes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          windows=(dist/*.exe)
          mac=(dist/*.dmg)
          test "${#windows[@]}" -eq 1
          test "${#mac[@]}" -eq 1
          test -s "${windows[0]}"
          test -s "${mac[0]}"
          test -s "docs/release/release-notes-${GITHUB_REF_NAME}.md"

      - name: Publish both installers together
        # Third-party action with contents: write, pinned to the v3.0.3 commit.
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: docs/release/release-notes-${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.dmg
            dist/ffmpeg-*-source.tar.gz
