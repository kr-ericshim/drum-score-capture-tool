name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "codex/release-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_glob: dist/*.exe
          - os: macos-15
            artifact_glob: dist/*.dmg

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    env:
      DRUMSHEET_ENABLE_SIGNING: "false"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: desktop/package-lock.json

      - name: Check release versions
        run: node desktop/scripts/check-release-version.js

      - name: Install backend build dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r backend/requirements-build.txt

      - name: Run backend test suite
        shell: bash
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p 'test_*.py'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Smoke test desktop startup contract
        working-directory: desktop
        shell: bash
        run: npm run test:desktop-smoke

      - name: Verify renderer-v2
        working-directory: desktop
        shell: bash
        run: npm run verify:renderer-v2

      - name: Run desktop node tests
        working-directory: desktop
        shell: bash
        run: npm run test:desktop-node

      - name: Build release artifacts
        working-directory: desktop
        run: npm run dist:release

      - name: Smoke test packaged Electron app
        working-directory: desktop
        run: npm run smoke:packaged-electron

      - name: Smoke test packaged backend runtime
        working-directory: desktop
        run: npm run smoke:packaged-runtime

      - name: Save package size report
        uses: actions/upload-artifact@v4
        with:
          name: package-size-${{ matrix.os }}
          path: dist/package-size-*.json
          if-no-files-found: error

      - name: Verify release upload assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=( ${{ matrix.artifact_glob }} )
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No release upload assets matched: ${{ matrix.artifact_glob }}" >&2
            exit 1
          fi
          version="$(node -p "require('./desktop/package.json').version")"
          for artifact in "${artifacts[@]}"; do
            if [ ! -s "$artifact" ]; then
              echo "Release upload asset is missing or empty: $artifact" >&2
              exit 1
            fi
            case "$artifact" in
              *"$version"*) ;;
              *)
                echo "Release upload asset does not include version $version: $artifact" >&2
                exit 1
                ;;
            esac
            ls -lh "$artifact"
          done

      - name: Save verified installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download both verified platform installers
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Confirm both platforms and release notes
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          windows=(dist/*.exe)
          mac=(dist/*.dmg)
          test "${#windows[@]}" -eq 1
          test "${#mac[@]}" -eq 1
          test -s "${windows[0]}"
          test -s "${mac[0]}"
          test -s "docs/release/release-notes-${GITHUB_REF_NAME}.md"

      - name: Publish both installers together
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/release/release-notes-${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/*.dmg
